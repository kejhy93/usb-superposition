name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -v
      - name: CLI smoke test (recorded Framework 16 snapshot)
        run: |
          usbinspect --fixture tests/fixtures/fw16-charger-dock-hdmi.json --all
          usbinspect --fixture tests/fixtures/fw16-charger-dock-hdmi.json --json \
            | python -c "import json,sys; s=json.load(sys.stdin); assert s['summary']['charging_w'] == 75.0"
      - name: CLI on the runner's own /sys (must not crash)
        run: usbinspect --all

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build
      - name: Install wheel and run it
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/usbinspect --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
