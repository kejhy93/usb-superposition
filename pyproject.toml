[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-superposition"
dynamic = ["version"]
description = "USB devices, USB-C ports, Power Delivery and negotiated vs. possible modes — CLI, TUI and KDE Plasma widget"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []  # the collector is stdlib-only

[project.optional-dependencies]
tui = ["textual>=0.80"]
daemon = ["pyudev>=0.24"]
dev = ["pytest>=8", "ruff>=0.15", "build>=1.2", "textual>=0.80"]

[project.scripts]
usbinspect = "usbinspect.cli:main"

[tool.setuptools.dynamic]
version = { attr = "usbinspect.__version__" }

[tool.setuptools.packages.find]
include = ["usbinspect*"]

[tool.setuptools.package-data]
usbinspect = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PLR0133"]
ignore = ["E501", "RUF001", "RUF003"]  # line length is the formatter's job; ×, ·, – are intentional
