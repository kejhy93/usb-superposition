[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-superposition"
dynamic = ["version"]
description = "USB devices, USB-C ports, Power Delivery and negotiated vs. possible modes — CLI, TUI and KDE Plasma widget"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []  # the collector is stdlib-only

[project.optional-dependencies]
tui = ["textual>=0.80"]
daemon = ["pyudev>=0.24"]
dev = ["pytest>=8"]

[project.scripts]
usbinspect = "usbinspect.cli:main"

[tool.setuptools.dynamic]
version = { attr = "usbinspect.__version__" }

[tool.setuptools.packages.find]
include = ["usbinspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
